<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace - My Page</title>
    <link rel="stylesheet" href="styles.css">
    <script src="api.js"></script>
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <a href="index.html" class="nav-item" title="Home">🏠</a>
        <a href="chats.html" class="nav-item" title="Chat">💬</a>
        <a href="Videos.html" class="nav-item" title="Videos">🎬</a>
        <a href="MyPage.html" class="nav-item active" title="My Page">👤</a>
        <a href="Resources.html" class="nav-item" title="Resources">📚</a>
        <a href="#" onclick="SafeSpaceAPI.logout(); return false;" class="nav-item" title="Logout" style="margin-top: auto; color: #e53e3e;">🚪</a>
    </nav>

    <main>
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-info">
                <div class="profile-avatar" id="profile-avatar">👤</div>
                <div class="profile-details">
                    <h2 id="profile-name">Loading...</h2>
                    <p id="profile-type"></p>
                    <p id="profile-bio"></p>
                </div>
            </div>
        </div>

        <!-- Edit Profile (only for own profile) -->
        <div id="edit-profile-section" style="display: none;">
            <div class="card">
                <h2>✏️ ערוך פרופיל</h2>
                <div class="form-group">
                    <label>BIO</label>
                    <input type="text" id="edit-bio" placeholder="תאר את עצמך...">
                </div>
                <div class="form-group">
                    <label>סוג חרדה</label>
                    <select id="edit-anxiety">
                        <option value="">בחר סוג</option>
                        <option value="anxiety">חרדה כללית</option>
                        <option value="social">חרדה סוציאלית</option>
                        <option value="panic">התקפי פניקה</option>
                        <option value="trauma">טראומה</option>
                        <option value="other">אחר</option>
                    </select>
                </div>
                <button class="btn" onclick="updateProfile()">שמור שינויים</button>
            </div>
        </div>

        <!-- Create Post (only for own profile) -->
        <div id="create-post-section" style="display: none;">
            <div class="card">
                <h2>📝 שתף משהו</h2>
                <div class="post-creator">
                    <textarea id="post-content" class="post-input" placeholder="מה על דעתך? שתף מחשבות, טיפים, או סיפור..."></textarea>
                    <div class="post-actions">
                        <button class="btn" onclick="createPost()">פרסם</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Posts Section -->
        <div>
            <h2>📰 הפוסטים שלי</h2>
            <div id="posts-container">
                <p style="color: #a0aec0; text-align: center; padding: 20px;">לא יש פוסטים עדיין</p>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const viewingUserId = urlParams.get('user');
        let currentUser = SafeSpaceAPI.getCurrentUser();

        async function loadProfile() {
            try {
                let profile;
                const isOwnProfile = !viewingUserId || (currentUser && viewingUserId == currentUser.id);

                if (isOwnProfile) {
                    profile = await SafeSpaceAPI.getMyProfile();
                } else {
                    profile = await SafeSpaceAPI.getUserProfile(viewingUserId);
                }

                // Update profile header
                document.getElementById('profile-name').textContent = profile.username;
                document.getElementById('profile-avatar').textContent = profile.username.charAt(0).toUpperCase();
                document.getElementById('profile-type').textContent = profile.anxiety_type || 'קהילה';
                document.getElementById('profile-bio').textContent = profile.bio || 'ברוכים הבאים ל-SafeSpace!';

                // Show edit section only for own profile
                if (isOwnProfile) {
                    document.getElementById('edit-profile-section').style.display = 'block';
                    document.getElementById('create-post-section').style.display = 'block';
                    document.getElementById('edit-bio').value = profile.bio || '';
                    document.getElementById('edit-anxiety').value = profile.anxiety_type || '';
                }

                // Load posts
                await loadPosts(profile.id);
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function loadPosts(userId) {
            try {
                const posts = await SafeSpaceAPI.getUserPosts(userId);
                const container = document.getElementById('posts-container');

                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p style="color: #a0aec0; text-align: center; padding: 20px;">לא יש פוסטים עדיין</p>';
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <div class="post">
                        <div class="post-header">
                            <div class="post-avatar">${currentUser.username.charAt(0).toUpperCase()}</div>
                            <div class="post-author">
                                <div class="post-author-name">${currentUser.username}</div>
                                <div class="post-author-type">${currentUser.anxiety_type || 'קהילה'}</div>
                            </div>
                            <div class="post-time">${new Date(post.created_at).toLocaleDateString()}</div>
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-actions">
                            <div class="post-action" onclick="likePost(${post.id})">
                                ❤️ <span id="likes-${post.id}">${post.likes}</span> Likes
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        async function createPost() {
            const content = document.getElementById('post-content').value.trim();

            if (!content) {
                alert('אנא כתוב משהו');
                return;
            }

            try {
                await SafeSpaceAPI.createPost(content);
                document.getElementById('post-content').value = '';
                await loadProfile();
            } catch (error) {
                console.error('Error creating post:', error);
                alert('שגיאה בפרסום הפוסט');
            }
        }

        async function updateProfile() {
            const bio = document.getElementById('edit-bio').value.trim();
            const anxiety_type = document.getElementById('edit-anxiety').value;

            try {
                await SafeSpaceAPI.updateProfile(bio, anxiety_type);
                alert('פרופיל עודכן!');
                await loadProfile();
            } catch (error) {
                console.error('Error updating profile:', error);
                alert('שגיאה בעדכון הפרופיל');
            }
        }

        async function likePost(postId) {
            try {
                const result = await SafeSpaceAPI.likePost(postId);
                document.getElementById(`likes-${postId}`).textContent = result.post.likes;
            } catch (error) {
                console.error('Error liking post:', error);
            }
        }

        // Load profile on page load
        window.addEventListener('load', () => {
            if (!SafeSpaceAPI.isLoggedIn()) {
                window.location.href = 'index.html';
            }
            currentUser = SafeSpaceAPI.getCurrentUser();
            loadProfile();
        });
    </script>
</body>
</html>
